version: "2"
linters:
  default: standard
  enable:
    - depguard
    - ginkgolinter
    - nilerr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    depguard:
      rules:
        restricted-packages:
          files:
            - $all
          deny:
            - pkg: ^html/template$
              desc: stdlib html/template must not be used
            - pkg: ^log$
              desc: stdlib log must not be used
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
  settings:
    goimports:
      local-prefixes:
        - github.com/cybozu-go/etcdpasswd
